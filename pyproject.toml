[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-curve-sofr"
version = "0.1.0"
description = "Collateral-aware SOFR multi-curve bootstrap, pricing, and risk engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "notebook>=7.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
sofr-export-snapshot = "multi_curve_sofr.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["multi_curve_sofr"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length: not worth hand-wrapping dense math expressions

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after pytest.importorskip(...) are intentional
"*.ipynb" = ["E402"]  # notebooks set up sys.path / PROJECT_ROOT before importing

[tool.mypy]
python_version = "3.10"
files = ["multi_curve_sofr"]
ignore_missing_imports = true  # ponytail: pandas/scipy/QuantLib ship no stubs; type our code, not theirs
