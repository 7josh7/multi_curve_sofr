name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Python 3.10 target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check minimum supported Python
        run: mypy

  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Core tests
        run: pytest -q -m "not quantlib"

  quantlib:
    name: Optional QuantLib alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with QuantLib
        run: python -m pip install -c constraints.txt -e ".[dev,quantlib]"
      - name: QuantLib comparison
        run: pytest -q -m quantlib
